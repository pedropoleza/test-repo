<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155EEF" />
    <title>Cofre de Documentos · Spark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <style>
      .topbar { position:sticky; top:0; z-index:30; height:60px; display:flex; align-items:center; gap:16px; padding:0 var(--content-pad); background:var(--white); border-bottom:1px solid var(--gray-200); }
      .loc { display:inline-flex; align-items:center; gap:9px; font-weight:700; color:var(--gray-900); white-space:nowrap; }
      .loc svg { width:18px; height:18px; color:var(--ghl-600); }
      .search { flex:1; max-width:520px; margin-left:auto; position:relative; }
      .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--gray-400); }
      .search input { width:100%; height:40px; padding:0 12px 0 36px; border:1px solid var(--gray-200); border-radius:var(--r-pill); background:var(--gray-50); font:inherit; color:var(--gray-900); }
      .search input:focus { outline:none; border-color:var(--ghl-400); background:var(--white); box-shadow:var(--shadow-blue-soft); }
      .wrap { padding:var(--content-pad); position:relative; z-index:1; }

      .pipes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
      .pipes__label { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--gray-400); font-weight:700; margin-right:2px; }
      .pipe { display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:var(--r-pill); background:var(--white); border:1px solid var(--gray-200); color:var(--gray-700); font-size:var(--fs-sm); font-weight:600; cursor:pointer; transition:all var(--d-fast); }
      .pipe:hover { border-color:var(--ghl-300); color:var(--ghl-700); }
      .pipe.is-active { background:var(--ghl-50); border-color:var(--ghl-300); color:var(--ghl-700); box-shadow:var(--shadow-blue-soft); }
      .pipe .count { font-variant-numeric:tabular-nums; background:var(--gray-100); color:var(--gray-600); padding:0 7px; border-radius:var(--r-pill); font-size:11px; }
      .pipe.is-active .count { background:var(--ghl-100); color:var(--ghl-700); }

      /* Grid de pastas */
      .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; }
      .fcard { text-align:left; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); padding:18px; cursor:pointer; transition:all var(--d) var(--bezier-out); display:flex; flex-direction:column; gap:12px; }
      .fcard:hover { border-color:var(--ghl-200); box-shadow:var(--shadow-md); transform:translateY(-2px); }
      .fcard__top { display:flex; align-items:center; justify-content:space-between; }
      .fcard__ico { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#eef4ff,#dbe7ff); color:var(--ghl-600); display:inline-flex; align-items:center; justify-content:center; }
      .fcard__ico svg { width:24px; height:24px; }
      .fcard__count { font-size:var(--fs-xs); color:var(--gray-500); font-weight:600; background:var(--gray-100); padding:3px 9px; border-radius:var(--r-pill); }
      .fcard__name { font-weight:700; color:var(--gray-900); font-size:var(--fs-md); letter-spacing:-.01em; }
      .fcard__meta { font-size:var(--fs-xs); color:var(--gray-500); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .fcard__pipe { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; padding:3px 9px; border-radius:var(--r-pill); background:var(--ghl-50); color:var(--ghl-700); border:1px solid var(--ghl-100); font-size:11px; font-weight:600; }
      .fcard--new { border-style:dashed; align-items:center; justify-content:center; color:var(--ghl-600); font-weight:700; min-height:120px; }
      .fcard--new:hover { background:var(--ghl-50); }
      .grid-empty { grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--gray-400); }

      /* Detalhe da pasta */
      .back { display:inline-flex; align-items:center; gap:8px; border:0; background:transparent; color:var(--ghl-700); font-weight:700; font-size:var(--fs-sm); cursor:pointer; padding:6px 2px; margin-bottom:14px; }
      .back:hover { color:var(--ghl-800); }
      .folder-body { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:24px; }
      .folder-head { display:flex; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--gray-150); }
      .avatar-lg { width:52px; height:52px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,var(--ghl-500),var(--ghl-700)); color:#fff; font-weight:800; font-size:17px; display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow-blue); }
      .folder-head__name { margin:0; font-size:var(--fs-xl); font-weight:800; letter-spacing:-.02em; color:var(--gray-900); }
      .folder-head__sub { margin:3px 0 0; color:var(--gray-500); font-size:var(--fs-sm); }
      .info-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
      .info-chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--r-pill); font-size:var(--fs-sm); color:var(--gray-700); }
      .info-chip svg { width:13px; height:13px; color:var(--gray-400); }
      .info-chip strong { color:var(--gray-900); font-weight:600; }
      .pipe-badge { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--r-pill); background:var(--ghl-50); color:var(--ghl-700); border:1px solid var(--ghl-100); font-size:var(--fs-sm); font-weight:600; }
      .pipe-badge .stage { color:var(--gray-500); font-weight:500; }

      /* Dropzone grande (novo documento) */
      .dropzone { margin-top:18px; border:2px dashed var(--gray-300); border-radius:var(--r-lg); padding:34px 20px; text-align:center; background:var(--gray-50); transition:all var(--d-fast); cursor:pointer; }
      .dropzone:hover { border-color:var(--ghl-300); background:var(--ghl-50); }
      .dropzone.is-drag { border-color:var(--ghl-500); background:var(--ghl-50); box-shadow:var(--shadow-blue-soft); transform:scale(1.005); }
      .dropzone__ico { width:48px; height:48px; margin:0 auto 10px; border-radius:14px; background:var(--white); border:1px solid var(--ghl-100); color:var(--ghl-600); display:flex; align-items:center; justify-content:center; }
      .dropzone__ico svg { width:24px; height:24px; }
      .dropzone__title { font-weight:700; color:var(--gray-800); }
      .dropzone__hint { font-size:var(--fs-sm); color:var(--gray-500); margin-top:3px; }

      .files { margin-top:18px; display:flex; flex-direction:column; }
      .file { display:grid; grid-template-columns:40px 1fr auto auto; align-items:center; gap:14px; padding:12px 6px; border-bottom:1px solid var(--gray-150); }
      .file:last-child { border-bottom:none; }
      .file__ico { width:40px; height:40px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; }
      .file__ico svg { width:20px; height:20px; }
      .file__ico[data-kind="image"] { background:#eef4ff; color:var(--ghl-600); }
      .file__ico[data-kind="pdf"]   { background:var(--danger-bg); color:var(--danger); }
      .file__ico[data-kind="doc"]   { background:var(--gray-100); color:var(--gray-600); }
      .file__name { font-weight:600; color:var(--gray-900); word-break:break-word; }
      .file__meta { font-size:var(--fs-xs); color:var(--gray-500); margin-top:2px; }
      .btn-ghost { height:32px; padding:0 14px; border-radius:var(--r-md); border:1px solid var(--gray-200); background:var(--white); color:var(--ghl-700); font-weight:600; font-size:var(--fs-sm); transition:all var(--d-fast); text-decoration:none; display:inline-flex; align-items:center; }
      .btn-ghost:hover { border-color:var(--ghl-300); box-shadow:var(--shadow-blue-soft); }
      .btn-ghost.is-disabled { color:var(--gray-300); border-color:var(--gray-150); pointer-events:none; }
      .empty-files { padding:24px 0; text-align:center; color:var(--gray-400); }

      /* Nav (Pastas | Modelos) */
      .nav { display:inline-flex; gap:4px; background:var(--gray-100); padding:4px; border-radius:var(--r-pill); }
      .nav__tab { border:0; background:transparent; color:var(--gray-600); font-weight:700; font-size:var(--fs-sm); padding:6px 15px; border-radius:var(--r-pill); cursor:pointer; transition:all var(--d-fast); }
      .nav__tab:hover { color:var(--ghl-700); }
      .nav__tab.is-active { background:var(--white); color:var(--ghl-700); box-shadow:var(--shadow-sm); }

      /* Templates */
      .tpl-layout { display:grid; grid-template-columns:290px 1fr; gap:20px; align-items:start; }
      .tpl-list { display:flex; flex-direction:column; gap:10px; }
      .tpl-item { text-align:left; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); padding:14px 15px; cursor:pointer; transition:all var(--d-fast); display:flex; flex-direction:column; gap:5px; }
      .tpl-item:hover { border-color:var(--ghl-200); box-shadow:var(--shadow-sm); }
      .tpl-item.is-active { border-color:var(--ghl-400); background:var(--ghl-50); box-shadow:var(--shadow-blue-soft); }
      .tpl-item__top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .tpl-item__title { font-weight:700; color:var(--gray-900); font-size:var(--fs-sm); line-height:1.3; }
      .tpl-item__lang { flex-shrink:0; font-size:10px; font-weight:800; color:var(--ghl-700); background:var(--ghl-100); padding:2px 7px; border-radius:var(--r-pill); letter-spacing:.04em; }
      .tpl-item__desc { font-size:var(--fs-xs); color:var(--gray-500); line-height:1.4; }
      .tpl-item__tag { align-self:flex-start; font-size:10px; color:var(--gray-500); background:var(--gray-100); padding:2px 8px; border-radius:var(--r-pill); font-weight:600; }

      .tpl-main { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
      .tpl-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--gray-150); background:var(--gray-50); }
      .tpl-bar__title { font-weight:800; color:var(--gray-900); font-size:var(--fs-md); margin-right:auto; letter-spacing:-.01em; }
      .tpl-pick { position:relative; min-width:240px; }
      .tpl-pick input { width:100%; height:36px; padding:0 12px 0 32px; border:1px solid var(--gray-200); border-radius:var(--r-pill); background:var(--white); font:inherit; font-size:var(--fs-sm); color:var(--gray-900); }
      .tpl-pick input:focus { outline:none; border-color:var(--ghl-400); box-shadow:var(--shadow-blue-soft); }
      .tpl-pick svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--gray-400); }
      .tpl-results { position:absolute; top:42px; left:0; right:0; z-index:40; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-md); box-shadow:var(--shadow-lg); max-height:260px; overflow:auto; }
      .tpl-results button { display:block; width:100%; text-align:left; border:0; background:transparent; padding:9px 12px; cursor:pointer; font:inherit; font-size:var(--fs-sm); color:var(--gray-800); border-bottom:1px solid var(--gray-100); }
      .tpl-results button:hover { background:var(--ghl-50); }
      .tpl-results .r-sub { font-size:var(--fs-xs); color:var(--gray-500); }
      .tpl-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; background:var(--ghl-50); border:1px solid var(--ghl-100); border-radius:var(--r-pill); font-size:var(--fs-sm); font-weight:600; color:var(--ghl-700); }
      .tpl-chip button { border:0; background:transparent; color:var(--ghl-500); cursor:pointer; font-weight:800; font-size:15px; line-height:1; padding:0; }
      .btn-primary { height:36px; padding:0 16px; border-radius:var(--r-md); border:0; background:var(--ghl-600); color:#fff; font-weight:700; font-size:var(--fs-sm); cursor:pointer; transition:all var(--d-fast); display:inline-flex; align-items:center; gap:7px; }
      .btn-primary:hover { background:var(--ghl-700); box-shadow:var(--shadow-blue); }
      .btn-primary:disabled { background:var(--gray-200); color:var(--gray-400); cursor:not-allowed; box-shadow:none; }
      .tpl-frame { width:100%; height:calc(100vh - 210px); min-height:520px; border:0; background:var(--gray-100); display:block; }
      .tpl-hint { font-size:var(--fs-xs); color:var(--gray-500); flex-basis:100%; }
      .tpl-placeholder { padding:70px 20px; text-align:center; color:var(--gray-400); }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span class="orb orb--a"></span><span class="orb orb--b"></span><span class="orb orb--c"></span></div>

    <header class="topbar">
      <span class="loc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.686-7-11a7 7 0 0114 0c0 5.314-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="loc-name">Cofre de Documentos</span>
      </span>
      <nav class="nav" id="nav">
        <button class="nav__tab is-active" data-screen="vault">Pastas</button>
        <button class="nav__tab" data-screen="templates">Modelos</button>
      </nav>
      <div class="search" id="topsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Pesquisar contato…" autocomplete="off" />
      </div>
    </header>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <main class="wrap">
      <section id="grid-view">
        <div class="pipes" id="pipes" hidden></div>
        <div class="grid" id="grid"></div>
      </section>
      <section id="folder-view" hidden>
        <button class="back" id="back">← Pastas</button>
        <div class="folder-body" id="folder-body"></div>
      </section>
      <section id="tpl-view" hidden>
        <div class="tpl-layout">
          <aside class="tpl-list" id="tpl-list"></aside>
          <div class="tpl-main">
            <div class="tpl-bar" id="tpl-bar">
              <span class="tpl-bar__title">Selecione um modelo à esquerda</span>
            </div>
            <div id="tpl-body"><div class="tpl-placeholder">Escolha um modelo para pré-visualizar e preencher com os dados de um contato.</div></div>
          </div>
        </div>
      </section>
    </main>

    <input type="file" id="file-input" multiple hidden accept="image/*,application/pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx" />

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
      const initials = (n) => (n || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      const humanSize = (b) => (b==null) ? "" : b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB";
      const SRC = { media:"Nuvem", conversation:"WhatsApp", form:"Formulário", upload:"Enviado" };
      const ICONS = {
        folder: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>',
        up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>',
        phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>',
        mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>',
        image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
        pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
        doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>',
      };
      const kindOf = (m, n) => { m=(m||"").toLowerCase(); n=(n||"").toLowerCase();
        if (m.startsWith("image/")||/\.(png|jpe?g|gif|webp|heic|bmp)$/.test(n)) return "image";
        if (m==="application/pdf"||n.endsWith(".pdf")) return "pdf"; return "doc"; };

      let MODE="demo", SESSION=null;
      let DOCS_FOLDERS=[], FILES=[], INFO={};
      let PIPELINES=[], CPMAP={}, activePipe="all";
      let view="grid", currentId=null, searchQ="", searchResults=[], searchTimer=null;
      let screen="vault";
      let TPL_REGISTRY=[], tplCurrent=null, tplContact=null, tplTokens=null, tplHtmlCache={}, tplPickTimer=null;

      const filesOf = (cid) => FILES.filter((f) => f.contact === cid);
      const inPipe = (id) => activePipe==="all" || (CPMAP[id]?.pipelineId === activePipe);

      // ---------- GRID ----------
      function renderPipes() {
        const box = $("#pipes");
        if (!PIPELINES.length) { box.hidden = true; return; }
        box.hidden = false;
        const countIn = (pid) => DOCS_FOLDERS.filter((c) => CPMAP[c.id]?.pipelineId === pid).length;
        const chips = [`<span class="pipes__label">Setor</span>`,
          `<button class="pipe ${activePipe==="all"?"is-active":""}" data-pipe="all">Todos <span class="count">${DOCS_FOLDERS.length}</span></button>`]
          .concat(PIPELINES.map((p) => `<button class="pipe ${activePipe===p.id?"is-active":""}" data-pipe="${p.id}">${p.name} <span class="count">${countIn(p.id)}</span></button>`));
        box.innerHTML = chips.join("");
        box.querySelectorAll(".pipe").forEach((b) => b.addEventListener("click", () => { activePipe=b.dataset.pipe; renderGrid(); }));
      }

      function cardsToShow() {
        if (searchQ) {
          const src = MODE==="live" ? searchResults : DEMO_CONTACTS.filter((c)=>c.name.toLowerCase().includes(searchQ.toLowerCase()));
          return src;
        }
        return DOCS_FOLDERS.filter((c) => inPipe(c.id));
      }

      function renderGrid() {
        renderPipes();
        const cards = cardsToShow();
        const grid = $("#grid");
        const items = cards.map((c) => {
          const n = filesOf(c.id).length;
          const pinfo = CPMAP[c.id];
          const pbadge = pinfo?.pipelineName ? `<span class="fcard__pipe">${pinfo.pipelineName}</span>` : "";
          const meta = [c.email, c.phone].filter(Boolean).join(" · ") || "—";
          return `<button class="fcard" data-id="${c.id}">
            <div class="fcard__top"><span class="fcard__ico">${ICONS.folder}</span><span class="fcard__count">${n} arq.</span></div>
            <div><div class="fcard__name">${c.name}</div><div class="fcard__meta">${meta}</div></div>
            ${pbadge}
          </button>`;
        }).join("");
        const empty = !cards.length ? `<div class="grid-empty">${searchQ ? "Nenhum contato encontrado." : "Nenhuma pasta ainda. Pesquise um contato acima para começar."}</div>` : "";
        grid.innerHTML = items + empty;
        grid.querySelectorAll(".fcard[data-id]").forEach((b) => b.addEventListener("click", () => openFolder(b.dataset.id)));
      }

      // ---------- DETALHE ----------
      function contactInfo(id) {
        return INFO[id] || DOCS_FOLDERS.find((c)=>c.id===id) || searchResults.find((c)=>c.id===id) || { id, name: id };
      }
      function openFolder(id) { currentId = id; view = "folder"; renderView(); }
      function backToGrid() { view = "grid"; currentId = null; renderView(); }

      function renderFolderBody() {
        const c = contactInfo(currentId);
        const pinfo = CPMAP[c.id];
        const chips = [];
        if (pinfo?.pipelineName) chips.push(`<span class="pipe-badge">${pinfo.pipelineName}${pinfo.stageName?` <span class="stage">· ${pinfo.stageName}</span>`:""}</span>`);
        if (c.phone) chips.push(`<span class="info-chip">${ICONS.phone}<span>Telefone:</span> <strong>${c.phone}</strong></span>`);
        if (c.email) chips.push(`<span class="info-chip">${ICONS.mail}<span>Email:</span> <strong>${c.email}</strong></span>`);
        const list = filesOf(c.id);
        const head = `<div class="folder-head"><span class="avatar-lg">${initials(c.name)}</span><div><h2 class="folder-head__name">${c.name}</h2><p class="folder-head__sub">${list.length} documento${list.length===1?"":"s"}</p>${chips.length?`<div class="info-chips">${chips.join("")}</div>`:""}</div></div>`;
        const dz = `<div class="dropzone" id="dropzone"><div class="dropzone__ico">${ICONS.up}</div><div class="dropzone__title">Arraste documentos aqui</div><div class="dropzone__hint">ou clique para escolher · imagens, PDF, DOC, XLS (até 4MB)</div></div>`;
        const files = list.length ? `<div class="files">${list.map(fileRow).join("")}</div>` : `<div class="empty-files">Nenhum documento nesta pasta ainda</div>`;
        $("#folder-body").innerHTML = head + dz + files;
        wireDropzone(c);
      }
      function fileRow(f) {
        const kind = kindOf(f.mime, f.name);
        const meta = [SRC[f.source]||f.source, humanSize(f.size), (f.at||"").slice(0,10)].filter(Boolean).join(" · ");
        let action;
        if (f.blobUrl) action = `<a class="btn-ghost" href="${f.blobUrl}" target="_blank" rel="noopener">Abrir</a>`;
        else if (f.has_content && MODE==="live") action = `<a class="btn-ghost" href="/api/file?id=${encodeURIComponent(f.id)}&session=${encodeURIComponent(SESSION)}" target="_blank" rel="noopener">Abrir</a>`;
        else action = `<span class="btn-ghost is-disabled">Processando</span>`;
        return `<div class="file"><div><span class="file__ico" data-kind="${kind}">${ICONS[kind]}</span></div><div><div class="file__name">${f.name||"—"}</div><div class="file__meta">${meta}</div></div><span></span>${action}</div>`;
      }

      function renderView() {
        $("#grid-view").hidden = view!=="grid";
        $("#folder-view").hidden = view!=="folder";
        if (view==="grid") renderGrid(); else renderFolderBody();
      }

      // ---------- UPLOAD (drag-drop) ----------
      let pendingContact=null;
      function wireDropzone(c) {
        const z = $("#dropzone"); if (!z) return;
        z.addEventListener("click", () => { pendingContact=c; $("#file-input").click(); });
        ["dragover","dragenter"].forEach(ev => z.addEventListener(ev,(e)=>{e.preventDefault();z.classList.add("is-drag");}));
        ["dragleave","dragend"].forEach(ev => z.addEventListener(ev,(e)=>{e.preventDefault();z.classList.remove("is-drag");}));
        z.addEventListener("drop",(e)=>{ e.preventDefault(); z.classList.remove("is-drag"); pendingContact=c; handleFiles(e.dataTransfer.files); });
      }
      $("#file-input").addEventListener("change",(e)=>{ handleFiles(e.target.files); e.target.value=""; });
      async function handleFiles(fileList) { const c=pendingContact; if(!c) return; for (const f of fileList) await uploadOne(c, f); }
      async function uploadOne(c, file) {
        if (file.size > 4*1024*1024) { toast("warn","Arquivo acima de 4MB",file.name); return; }
        ensureFolder(c);
        if (MODE==="demo") { const blobUrl=URL.createObjectURL(file); FILES.unshift({id:"demo-"+Math.random().toString(36).slice(2),contact:c.id,name:file.name,mime:file.type,size:file.size,source:"upload",at:new Date().toISOString(),blobUrl}); toast("success","Documento adicionado",file.name); renderFolderBody(); return; }
        try {
          toast("info","Enviando…",file.name);
          const dataBase64 = await fileToBase64(file);
          const r = await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json","x-vault-session":SESSION},body:JSON.stringify({contactId:c.id,contactName:c.name,filename:file.name,mime:file.type,dataBase64})});
          if (!r.ok) throw new Error("http_"+r.status);
          const j = await r.json();
          FILES.unshift({id:j.document.id,contact:c.id,name:file.name,mime:file.type,size:file.size,source:"upload",at:new Date().toISOString(),has_content:true});
          toast("success","Documento adicionado",file.name); renderFolderBody();
        } catch (err) { toast("warn","Falha ao enviar",file.name+" · "+err.message); }
      }
      function ensureFolder(c) { if (!DOCS_FOLDERS.find((x)=>x.id===c.id)) { DOCS_FOLDERS.push({id:c.id,name:c.name,email:c.email,phone:c.phone}); INFO[c.id]={id:c.id,name:c.name,email:c.email,phone:c.phone}; } }
      const fileToBase64 = (file) => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });

      // ---------- SEARCH ----------
      $("#search").addEventListener("input",(e)=>{ searchQ=e.target.value.trim(); clearTimeout(searchTimer);
        if (MODE==="live" && searchQ) searchTimer=setTimeout(runSearch,250); else { searchResults=[]; if(view!=="grid"){view="grid";} renderView(); }
      });
      async function runSearch() {
        try { const r=await fetch("/api/contacts?q="+encodeURIComponent(searchQ),{headers:{"x-vault-session":SESSION}});
          if (r.ok) { searchResults=(await r.json()).contacts||[]; for(const c of searchResults) INFO[c.id]={id:c.id,name:c.name,email:c.email,phone:c.phone}; }
        } catch {}
        if (view!=="grid") view="grid";
        renderGrid();
      }

      function toast(kind,title,sub){ const n=el("div",`toast toast--${kind==="warn"?"warn":kind==="info"?"info":"success"}`); n.innerHTML=`<div class="toast__icon">${kind==="warn"?"!":"✓"}</div><div><div class="toast__title">${title}</div><div class="toast__sub">${sub||""}</div></div>`; $("#toasts").appendChild(n); setTimeout(()=>{n.classList.add("is-out");setTimeout(()=>n.remove(),260);},3200); }

      $("#back").addEventListener("click", backToGrid);

      // ---------- SCREENS (Pastas | Modelos) ----------
      function showScreen(name) {
        screen = name;
        $("#nav").querySelectorAll(".nav__tab").forEach((t) => t.classList.toggle("is-active", t.dataset.screen === name));
        $("#topsearch").style.display = name === "vault" ? "" : "none";
        $("#grid-view").hidden = name !== "vault" || view !== "grid";
        $("#folder-view").hidden = name !== "vault" || view !== "folder";
        $("#tpl-view").hidden = name !== "templates";
        if (name === "vault") renderView();
        else { if (!TPL_REGISTRY.length) loadRegistry(); else renderTplList(); }
      }
      $("#nav").querySelectorAll(".nav__tab").forEach((t) => t.addEventListener("click", () => showScreen(t.dataset.screen)));

      // ---------- TEMPLATES ----------
      async function loadRegistry() {
        try { const r = await fetch("./templates/registry.json"); if (r.ok) TPL_REGISTRY = (await r.json()).templates || []; }
        catch (err) { console.warn("[tpl] registry falhou:", err.message); }
        renderTplList();
      }
      function renderTplList() {
        const box = $("#tpl-list");
        box.innerHTML = TPL_REGISTRY.map((t) => `
          <button class="tpl-item ${tplCurrent===t.id?"is-active":""}" data-id="${t.id}">
            <div class="tpl-item__top"><span class="tpl-item__title">${t.title}</span><span class="tpl-item__lang">${t.lang}</span></div>
            <div class="tpl-item__desc">${t.desc||""}</div>
            ${t.tag?`<span class="tpl-item__tag">${t.tag}</span>`:""}
          </button>`).join("") || `<div class="tpl-placeholder">Nenhum modelo.</div>`;
        box.querySelectorAll(".tpl-item[data-id]").forEach((b) => b.addEventListener("click", () => selectTemplate(b.dataset.id)));
      }
      function selectTemplate(id) {
        tplCurrent = id; tplContact = null; tplTokens = null;
        renderTplList(); renderTplBar(); refreshPreview();
      }
      function currentTpl() { return TPL_REGISTRY.find((t) => t.id === tplCurrent); }
      function renderTplBar() {
        const t = currentTpl(); if (!t) return;
        const picker = tplContact
          ? `<span class="tpl-chip">${tplContact.name}<button title="Trocar contato" id="tpl-clear">×</button></span>`
          : `<div class="tpl-pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="tpl-search" type="search" placeholder="Preencher com contato…" autocomplete="off"/><div id="tpl-results"></div></div>`;
        $("#tpl-bar").innerHTML = `
          <span class="tpl-bar__title">${t.title}</span>
          ${picker}
          <button class="btn-primary" id="tpl-print" ${tplContact?"":"disabled"}>${ICONS.pdf}<span>Imprimir / PDF</span></button>`;
        const clr = $("#tpl-clear"); if (clr) clr.addEventListener("click", () => { tplContact=null; tplTokens=null; renderTplBar(); refreshPreview(); });
        const si = $("#tpl-search"); if (si) si.addEventListener("input", onTplPick);
        const pb = $("#tpl-print"); if (pb) pb.addEventListener("click", printTpl);
      }
      function onTplPick(e) {
        const q = e.target.value.trim(); clearTimeout(tplPickTimer);
        if (!q) { $("#tpl-results").innerHTML = ""; return; }
        tplPickTimer = setTimeout(async () => {
          let list = [];
          if (MODE === "live") {
            try { const r = await fetch("/api/contacts?q="+encodeURIComponent(q), {headers:{"x-vault-session":SESSION}}); if (r.ok) list = (await r.json()).contacts||[]; } catch {}
          } else { list = DEMO_CONTACTS.filter((c)=>c.name.toLowerCase().includes(q.toLowerCase())); }
          const box = $("#tpl-results"); if (!box) return;
          box.innerHTML = list.length ? list.map((c)=>`<button data-cid="${c.id}"><div>${c.name}</div><div class="r-sub">${[c.email,c.phone].filter(Boolean).join(" · ")||"—"}</div></button>`).join("") : `<button disabled>Nenhum contato</button>`;
          box.querySelectorAll("button[data-cid]").forEach((b)=>b.addEventListener("click",()=>pickTplContact(list.find((c)=>c.id===b.dataset.cid))));
        }, 250);
      }
      async function pickTplContact(c) {
        if (!c) return; tplContact = c; tplTokens = null; renderTplBar();
        if (MODE === "live") {
          try { const r = await fetch("/api/contact-data?id="+encodeURIComponent(c.id), {headers:{"x-vault-session":SESSION}}); if (r.ok) tplTokens = (await r.json()).tokens || {}; }
          catch (err) { toast("warn","Não consegui puxar os dados",err.message); }
        }
        if (!tplTokens) tplTokens = demoTokens(c);
        refreshPreview();
      }
      function demoTokens(c) {
        return { "contact.full_name":c?.name||"", "contact.email":c?.email||"", "contact.phone":c?.phone||"", "today": new Date().toISOString().slice(0,10) };
      }
      function fillTokens(html, tokens) {
        return html.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, k) => (tokens && tokens[k] != null ? String(tokens[k]) : ""));
      }
      async function refreshPreview() {
        const t = currentTpl(); if (!t) return;
        const body = $("#tpl-body");
        let html = tplHtmlCache[t.file];
        if (html == null) {
          body.innerHTML = `<div class="tpl-placeholder">Carregando modelo…</div>`;
          try { const r = await fetch("./templates/"+t.file); html = r.ok ? await r.text() : null; } catch { html = null; }
          if (html == null) { body.innerHTML = `<div class="tpl-placeholder">Não consegui carregar este modelo.</div>`; return; }
          tplHtmlCache[t.file] = html;
        }
        const tokens = tplContact ? (tplTokens || {}) : { "today": new Date().toISOString().slice(0,10) };
        const filled = fillTokens(html, tokens);
        body.innerHTML = `<iframe id="tpl-frame" class="tpl-frame" title="${t.title}"></iframe>`;
        const frame = $("#tpl-frame");
        frame.srcdoc = filled;
      }
      function printTpl() {
        const frame = $("#tpl-frame");
        if (!frame || !frame.contentWindow) return;
        try { frame.contentWindow.focus(); frame.contentWindow.print(); }
        catch (err) { toast("warn","Não consegui abrir a impressão",err.message); }
      }

      function ingest(docs) {
        const byC={}, files=[];
        for (const d of docs) { const cid=d.contact_id||"__sem_contato__"; (byC[cid] ||= {id:cid, name:d.contact_name||d.contact_id||"Sem contato"}); files.push({id:d.id,contact:cid,name:d.filename||"(sem nome)",mime:d.mime,size:d.size_bytes,source:d.source,at:d.at,has_content:d.has_content}); }
        DOCS_FOLDERS=Object.values(byC); FILES=files; for(const c of DOCS_FOLDERS) INFO[c.id]=c;
      }
      function requestGhlContext() {
        return new Promise((resolve,reject)=>{ let done=false;
          const onMsg=(e)=>{ const d=e.data; if(d&&d.message==="REQUEST_USER_DATA_RESPONSE"){ done=true; window.removeEventListener("message",onMsg); resolve(d.payload); } };
          window.addEventListener("message",onMsg);
          try { window.parent.postMessage({message:"REQUEST_USER_DATA"},"*"); } catch {}
          setTimeout(()=>{ if(!done){ window.removeEventListener("message",onMsg); reject(new Error("no_ghl_context")); } },4000);
        });
      }
      async function boot() {
        if (window.self !== window.top) {
          try {
            const encrypted = await requestGhlContext();
            const sres = await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({encrypted})});
            if (!sres.ok) throw new Error("session_"+sres.status);
            const s = await sres.json(); SESSION=s.sessionToken; MODE="live";
            $("#loc-name").textContent = s.locationName || s.locationId;
            const dres = await fetch("/api/documents",{headers:{"x-vault-session":SESSION}});
            if (dres.ok) ingest((await dres.json()).documents||[]);
            try { const pr=await fetch("/api/pipelines",{headers:{"x-vault-session":SESSION}}); if(pr.ok){ const pj=await pr.json(); PIPELINES=pj.pipelines||[]; CPMAP=pj.contacts||{}; } } catch {}
            renderView(); return;
          } catch (err) { console.warn("[vault] live falhou, demo:", err.message); }
        }
        MODE="demo"; $("#loc-name").textContent="Samantha's Account (demo)"; loadDemo(); renderView();
      }

      const DEMO_CONTACTS = [
        { id:"josiane", name:"Josiane Ramos", email:"josiane.ramos@email.com", phone:"+1 (973) 555-0142" },
        { id:"ana", name:"Ana Beatriz", email:"ana.beatriz@email.com", phone:"+1 (862) 555-0199" },
        { id:"carlos", name:"Carlos Nunes", email:"carlos.nunes@email.com", phone:"+1 (201) 555-0177" },
        { id:"marina", name:"Marina Alves", email:"marina.alves@email.com", phone:"+1 (973) 555-0163" },
        { id:"teste", name:"Teste Spark", email:null, phone:null },
      ];
      function loadDemo() {
        DOCS_FOLDERS = DEMO_CONTACTS.slice(0,3).map((c)=>({...c}));
        for (const c of DOCS_FOLDERS) INFO[c.id]=c;
        FILES = [
          { id:"1", contact:"josiane", name:"passaporte-antigo.pdf", mime:"application/pdf", size:842000, source:"upload", at:"2026-08-20", has_content:false },
          { id:"2", contact:"josiane", name:"foto-3x4.jpg", mime:"image/jpeg", size:210000, source:"upload", at:"2026-08-20", has_content:false },
          { id:"3", contact:"ana", name:"contrato-social.pdf", mime:"application/pdf", size:1500000, source:"upload", at:"2026-08-18", has_content:false },
        ];
        PIPELINES = [ { id:"p1", name:"1 · Seguro de Vida" }, { id:"p3", name:"3 · Empresas e Fiscal" } ];
        CPMAP = { josiane:{pipelineId:"p1",pipelineName:"1 · Seguro de Vida",stageName:"Follow-up"}, carlos:{pipelineId:"p1",pipelineName:"1 · Seguro de Vida",stageName:"Qualified"}, ana:{pipelineId:"p3",pipelineName:"3 · Empresas e Fiscal",stageName:"In Process"} };
      }
      boot();
    </script>
  </body>
</html>
