<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155EEF" />
    <title>Cofre de Documentos · Spark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <style>
      .badge--warn { background: var(--warn-bg); color: var(--warn); }
      .topbar { position:sticky; top:0; z-index:30; height:56px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 var(--content-pad); background:var(--white); border-bottom:1px solid var(--gray-200); }
      .lang-switch { display:inline-flex; align-items:center; gap:2px; background:var(--gray-100); padding:3px; border-radius:var(--r-pill); }
      .lang-switch button { border:0; background:transparent; padding:5px 10px; border-radius:var(--r-pill); font-weight:700; font-size:var(--fs-xs); letter-spacing:.04em; color:var(--gray-500); }
      .lang-switch button.is-active { background:var(--white); color:var(--ghl-700); box-shadow:var(--shadow-sm); }
      .mode-pill { display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 12px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; border:1px solid var(--gray-200); background:var(--gray-50); color:var(--gray-600); }
      .mode-pill[data-mode="live"] { background:var(--success-bg); color:#047857; border-color:#a7f3d0; }
      .mode-pill[data-mode="demo"] { background:var(--warn-bg); color:var(--warn); border-color:#fde68a; }

      .wrap { padding:var(--content-pad); position:relative; z-index:1; }

      /* Pastas */
      .folders { display:flex; align-items:flex-end; gap:4px; flex-wrap:wrap; padding:0 6px; position:relative; z-index:2; }
      .folder-tab { display:inline-flex; align-items:center; gap:9px; padding:11px 16px 13px; background:var(--gray-100); border:1px solid var(--gray-200); border-bottom:none; border-radius:12px 12px 0 0; color:var(--gray-600); font-weight:600; font-size:var(--fs-base); transition:background var(--d-fast),color var(--d-fast); position:relative; top:1px; max-width:260px; }
      .folder-tab:hover { background:var(--gray-50); color:var(--gray-900); }
      .folder-tab .fico { width:18px; height:18px; flex-shrink:0; color:var(--ghl-500); }
      .folder-tab .fname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .folder-tab .fcount { font-variant-numeric:tabular-nums; background:var(--gray-200); color:var(--gray-600); padding:1px 8px; border-radius:var(--r-pill); font-size:11px; font-weight:700; }
      .folder-tab.is-active { background:var(--white); color:var(--ghl-700); box-shadow:0 -6px 16px -10px rgba(15,23,42,.22); z-index:3; }
      .folder-tab.is-active .fico { color:var(--ghl-600); }
      .folder-tab.is-active .fcount { background:var(--ghl-100); color:var(--ghl-700); }
      .folder-tab--new { background:transparent; border-style:dashed; color:var(--ghl-600); }
      .folder-tab--new:hover { background:var(--ghl-50); }

      .folder-body { background:var(--white); border:1px solid var(--gray-200); border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg); box-shadow:var(--shadow-sm); padding:24px; position:relative; z-index:1; min-height:220px; }
      .folder-head { display:flex; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--gray-150); }
      .avatar-lg { width:52px; height:52px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,var(--ghl-500),var(--ghl-700)); color:#fff; font-weight:800; font-size:17px; display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow-blue); }
      .folder-head__name { margin:0; font-size:var(--fs-xl); font-weight:800; letter-spacing:-.02em; color:var(--gray-900); }
      .folder-head__sub { margin:3px 0 0; color:var(--gray-500); font-size:var(--fs-sm); }
      .info-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
      .info-chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--r-pill); font-size:var(--fs-sm); color:var(--gray-700); }
      .info-chip svg { width:13px; height:13px; color:var(--gray-400); }
      .info-chip strong { color:var(--gray-900); font-weight:600; }

      /* Uploader */
      .uploader { margin-top:18px; border:1.5px dashed var(--gray-300); border-radius:var(--r-lg); padding:18px; display:flex; align-items:center; gap:14px; background:var(--gray-50); transition:all var(--d-fast); }
      .uploader.is-drag { border-color:var(--ghl-400); background:var(--ghl-50); box-shadow:var(--shadow-blue-soft); }
      .uploader__txt { color:var(--gray-500); font-size:var(--fs-sm); }
      .btn-primary { height:36px; padding:0 16px; border-radius:var(--r-md); border:0; background:var(--ghl-600); color:#fff; font-weight:700; font-size:var(--fs-sm); box-shadow:var(--shadow-blue); transition:all var(--d-fast); }
      .btn-primary:hover { background:var(--ghl-700); }
      .btn-primary:disabled { background:var(--gray-300); box-shadow:none; cursor:not-allowed; }

      /* Lista de arquivos */
      .files { margin-top:18px; display:flex; flex-direction:column; }
      .file { display:grid; grid-template-columns:40px 1fr auto auto auto; align-items:center; gap:14px; padding:12px 6px; border-bottom:1px solid var(--gray-150); }
      .file:last-child { border-bottom:none; }
      .file__ico { width:40px; height:40px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; }
      .file__ico svg { width:20px; height:20px; }
      .file__ico[data-kind="image"] { background:#eef4ff; color:var(--ghl-600); }
      .file__ico[data-kind="pdf"]   { background:var(--danger-bg); color:var(--danger); }
      .file__ico[data-kind="doc"]   { background:var(--gray-100); color:var(--gray-600); }
      .file__name { font-weight:600; color:var(--gray-900); word-break:break-word; }
      .file__meta { font-size:var(--fs-xs); color:var(--gray-500); margin-top:2px; }
      .src { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--gray-700); font-weight:500; }
      .src .dot { width:8px; height:8px; border-radius:50%; }
      .src[data-source="media"] .dot { background:var(--ghl-500); }
      .src[data-source="conversation"] .dot { background:var(--success); }
      .src[data-source="form"] .dot { background:var(--warn); }
      .src[data-source="upload"] .dot { background:#6366f1; }
      .btn-ghost { height:32px; padding:0 14px; border-radius:var(--r-md); border:1px solid var(--gray-200); background:var(--white); color:var(--ghl-700); font-weight:600; font-size:var(--fs-sm); transition:all var(--d-fast); text-decoration:none; display:inline-flex; align-items:center; }
      .btn-ghost:hover { border-color:var(--ghl-300); box-shadow:var(--shadow-blue-soft); }
      .btn-ghost.is-disabled { color:var(--gray-300); border-color:var(--gray-150); pointer-events:none; }
      .empty-files { padding:34px 0; text-align:center; color:var(--gray-400); }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span class="orb orb--a"></span><span class="orb orb--b"></span><span class="orb orb--c"></span></div>

    <header class="topbar">
      <span class="location-pill" title="Location ativa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.686-7-11a7 7 0 0114 0c0 5.314-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="loc-name">—</span>
      </span>
      <div style="display:inline-flex; align-items:center; gap:12px;">
        <span class="mode-pill" id="mode" data-mode="demo">demo</span>
        <div class="lang-switch" id="lang"><button data-lang="pt" class="is-active">PT</button><button data-lang="en">EN</button></div>
      </div>
    </header>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <main class="wrap">
      <div class="folders" id="folders"></div>
      <div class="folder-body" id="folder-body"></div>
    </main>

    <input type="file" id="file-input" multiple hidden accept="image/*,application/pdf,.doc,.docx,.txt,.xls,.xlsx" />

    <script>
      /* Cofre de Documentos — Custom Page (iframe GHL) só com pastas + arquivos + upload. */
      const I18N = {
        pt: { f_phone:"Telefone", f_email:"Email", add:"+ Adicionar arquivos", drag:"ou arraste os arquivos aqui (até 4MB)",
          open:"Abrir", pending:"Processando", files_n:(n)=>`${n} arquivo${n===1?"":"s"}`, empty:"Nenhum arquivo nesta pasta ainda",
          newfolder:"+ Nova pasta", prompt_name:"Nome do contato/pasta:",
          src_media:"Nuvem", src_conversation:"WhatsApp", src_form:"Formulário", src_upload:"Enviado",
          up_ok:"Arquivo adicionado", up_fail:"Falha ao enviar", too_big:"Arquivo acima de 4MB", uploading:"Enviando…" },
        en: { f_phone:"Phone", f_email:"Email", add:"+ Add files", drag:"or drop files here (up to 4MB)",
          open:"Open", pending:"Processing", files_n:(n)=>`${n} file${n===1?"":"s"}`, empty:"No files in this folder yet",
          newfolder:"+ New folder", prompt_name:"Contact / folder name:",
          src_media:"Cloud", src_conversation:"WhatsApp", src_form:"Form", src_upload:"Uploaded",
          up_ok:"File added", up_fail:"Upload failed", too_big:"File over 4MB", uploading:"Uploading…" },
      };
      let lang = "pt";
      const t = (k) => I18N[lang][k];
      const $ = (s, r = document) => r.querySelector(s);
      const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
      const initials = (name) => (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      const humanSize = (b) => !b && b!==0 ? "" : b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB";

      const ICONS = {
        folder: '<svg class="fico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>',
        phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>',
        mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>',
        image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
        pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
        doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>',
      };
      const kindOf = (mime, name) => {
        const m = (mime || "").toLowerCase(), n = (name || "").toLowerCase();
        if (m.startsWith("image/") || /\.(png|jpe?g|gif|webp|heic|bmp)$/.test(n)) return "image";
        if (m === "application/pdf" || n.endsWith(".pdf")) return "pdf";
        return "doc";
      };

      // Estado
      let MODE = "demo";            // "live" | "demo"
      let SESSION = null;           // JWT (live)
      let LOCATION = null;
      let FOLDERS = [];             // [{ id, name, phone?, email? }]
      let FILES = [];               // [{ id, contact, name, mime, size, source, status, at, has_content, blobUrl? }]
      let active = null;

      const filesOf = (cid) => FILES.filter((f) => f.contact === cid);

      function renderFolders() {
        const html = FOLDERS.map((c) => {
          const n = filesOf(c.id).length;
          return `<button class="folder-tab ${c.id===active?"is-active":""}" data-folder="${c.id}">${ICONS.folder}<span class="fname">${c.name}</span><span class="fcount">${n}</span></button>`;
        }).join("");
        $("#folders").innerHTML = html + `<button class="folder-tab folder-tab--new" id="new-folder">${t("newfolder")}</button>`;
        $("#folders").querySelectorAll(".folder-tab[data-folder]").forEach((b) => b.addEventListener("click", () => { active = b.dataset.folder; renderFolders(); renderBody(); }));
        $("#new-folder").addEventListener("click", newFolder);
      }

      function renderBody() {
        const c = FOLDERS.find((x) => x.id === active);
        if (!c) { $("#folder-body").innerHTML = `<div class="empty-files">${t("empty")}</div>`; return; }
        const chips = [];
        if (c.phone) chips.push(`<span class="info-chip">${ICONS.phone}<span>${t("f_phone")}:</span> <strong>${c.phone}</strong></span>`);
        if (c.email) chips.push(`<span class="info-chip">${ICONS.mail}<span>${t("f_email")}:</span> <strong>${c.email}</strong></span>`);
        const list = filesOf(c.id);
        const head = `<div class="folder-head">
          <span class="avatar-lg">${initials(c.name)}</span>
          <div><h2 class="folder-head__name">${c.name}</h2><p class="folder-head__sub">${t("files_n")(list.length)}</p>${chips.length?`<div class="info-chips">${chips.join("")}</div>`:""}</div>
        </div>`;
        const uploader = `<div class="uploader" id="uploader"><button class="btn-primary" id="add-files">${t("add")}</button><span class="uploader__txt">${t("drag")}</span></div>`;
        const files = list.length ? `<div class="files">${list.map(fileRow).join("")}</div>` : `<div class="empty-files">${t("empty")}</div>`;
        $("#folder-body").innerHTML = head + uploader + files;
        wireUploader();
      }

      function fileRow(f) {
        const kind = kindOf(f.mime, f.name);
        const ico = `<span class="file__ico" data-kind="${kind}">${ICONS[kind]}</span>`;
        const meta = [humanSize(f.size), (f.at||"").slice(0,10)].filter(Boolean).join(" · ");
        const srcBadge = `<span class="src" data-source="${f.source}"><span class="dot"></span>${t("src_"+f.source)}</span>`;
        let action;
        if (f.blobUrl) action = `<a class="btn-ghost" href="${f.blobUrl}" target="_blank" rel="noopener">${t("open")}</a>`;
        else if (f.has_content && MODE==="live") action = `<a class="btn-ghost" href="/api/file?id=${encodeURIComponent(f.id)}&session=${encodeURIComponent(SESSION)}" target="_blank" rel="noopener">${t("open")}</a>`;
        else action = `<span class="btn-ghost is-disabled">${t("pending")}</span>`;
        return `<div class="file"><div>${ico}</div><div><div class="file__name">${f.name||"—"}</div><div class="file__meta">${meta}</div></div>${srcBadge}<span></span>${action}</div>`;
      }

      // ---- Upload ----
      function wireUploader() {
        const z = $("#uploader"); if (!z) return;
        $("#add-files").addEventListener("click", () => $("#file-input").click());
        ["dragover","dragenter"].forEach(ev => z.addEventListener(ev, (e)=>{ e.preventDefault(); z.classList.add("is-drag"); }));
        ["dragleave","drop"].forEach(ev => z.addEventListener(ev, (e)=>{ e.preventDefault(); z.classList.remove("is-drag"); }));
        z.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
      }
      $("#file-input").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });

      async function handleFiles(fileList) {
        const c = FOLDERS.find((x) => x.id === active); if (!c) return;
        for (const file of fileList) {
          if (file.size > 4*1024*1024) { toast("warn", t("too_big"), file.name); continue; }
          if (MODE === "demo") { addDemoFile(c, file); continue; }
          try {
            toast("info", t("uploading"), file.name);
            const dataBase64 = await fileToBase64(file);
            const r = await fetch("/api/upload", { method:"POST", headers:{ "Content-Type":"application/json", "x-vault-session":SESSION },
              body: JSON.stringify({ contactId:c.id, contactName:c.name, filename:file.name, mime:file.type, dataBase64 }) });
            if (!r.ok) throw new Error("http_"+r.status);
            const j = await r.json();
            FILES.unshift({ id:j.document.id, contact:c.id, name:file.name, mime:file.type, size:file.size, source:"upload", status:"mirrored", at:new Date().toISOString(), has_content:true });
            toast("success", t("up_ok"), file.name);
            renderFolders(); renderBody();
          } catch (err) { toast("warn", t("up_fail"), file.name+" · "+err.message); }
        }
      }
      function addDemoFile(c, file) {
        const blobUrl = URL.createObjectURL(file);
        FILES.unshift({ id:"demo-"+Math.random().toString(36).slice(2), contact:c.id, name:file.name, mime:file.type, size:file.size, source:"upload", status:"mirrored", at:new Date().toISOString(), blobUrl });
        toast("success", t("up_ok"), file.name);
        renderFolders(); renderBody();
      }
      function fileToBase64(file) {
        return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(file); });
      }

      function newFolder() {
        const name = window.prompt(t("prompt_name"));
        if (!name || !name.trim()) return;
        const id = "local-" + Math.random().toString(36).slice(2, 10);
        FOLDERS.push({ id, name: name.trim() });
        active = id; renderFolders(); renderBody();
      }

      function toast(kind, title, sub) {
        const map = { success:"success", info:"info", warn:"warn" };
        const n = el("div", `toast toast--${map[kind]||"info"}`);
        n.innerHTML = `<div class="toast__icon">${kind==="warn"?"!":"✓"}</div><div><div class="toast__title">${title}</div><div class="toast__sub">${sub||""}</div></div>`;
        $("#toasts").appendChild(n); setTimeout(()=>{ n.classList.add("is-out"); setTimeout(()=>n.remove(),260); }, 3200);
      }

      // idioma
      $("#lang").addEventListener("click", (e) => { const b=e.target.closest("button"); if(!b) return; lang=b.dataset.lang; document.documentElement.lang=lang==="pt"?"pt-BR":"en"; $("#lang").querySelectorAll("button").forEach(x=>x.classList.toggle("is-active",x===b)); renderFolders(); renderBody(); });
      function setMode(mode, locName) { MODE=mode; const m=$("#mode"); m.dataset.mode=mode; m.textContent=mode; if(locName) $("#loc-name").textContent=locName; }

      function ingest(docs) {
        const byC = {}; const files = [];
        for (const d of docs) {
          const cid = d.contact_id || "__sem_contato__";
          (byC[cid] ||= { id: cid, name: d.contact_name || d.contact_id || "Sem contato" });
          files.push({ id:d.id, contact:cid, name:d.filename||"(sem nome)", mime:d.mime, size:d.size_bytes, source:d.source, status:d.status, at:d.at, has_content:d.has_content });
        }
        FOLDERS = Object.values(byC); FILES = files;
        if (!active && FOLDERS[0]) active = FOLDERS[0].id;
      }

      function requestGhlContext() {
        return new Promise((resolve, reject) => {
          let done=false;
          const onMsg=(e)=>{ const d=e.data; if(d&&d.message==="REQUEST_USER_DATA_RESPONSE"){ done=true; window.removeEventListener("message",onMsg); resolve(d.payload); } };
          window.addEventListener("message", onMsg);
          try { window.parent.postMessage({message:"REQUEST_USER_DATA"},"*"); } catch {}
          setTimeout(()=>{ if(!done){ window.removeEventListener("message",onMsg); reject(new Error("no_ghl_context")); } }, 4000);
        });
      }

      async function boot() {
        if (window.self !== window.top) {
          try {
            const encrypted = await requestGhlContext();
            const sres = await fetch("/api/session", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({encrypted}) });
            if (!sres.ok) throw new Error("session_"+sres.status);
            const s = await sres.json(); SESSION = s.sessionToken; LOCATION = s.locationId;
            const dres = await fetch("/api/documents", { headers:{ "x-vault-session":SESSION } });
            if (!dres.ok) throw new Error("documents_"+dres.status);
            ingest((await dres.json()).documents || []);
            setMode("live", s.locationName || s.locationId);
            renderFolders(); renderBody(); return;
          } catch (err) { console.warn("[vault] live falhou, demo:", err.message); }
        }
        loadDemo(); setMode("demo", "Spark Immigration (demo)"); renderFolders(); renderBody();
      }

      function loadDemo() {
        FOLDERS = [
          { id:"josiane", name:"Josiane Ramos", phone:"+1 (973) 555-0142", email:"josiane.ramos@email.com" },
          { id:"ana", name:"Ana Beatriz", phone:"+1 (862) 555-0199", email:"ana.beatriz@email.com" },
          { id:"carlos", name:"Carlos Nunes", phone:"+1 (201) 555-0177", email:"carlos.nunes@email.com" },
        ];
        FILES = [
          { id:"1", contact:"josiane", name:"passaporte-antigo.pdf", mime:"application/pdf", size:842000, source:"media", status:"mirrored", at:"2026-08-20", has_content:false },
          { id:"2", contact:"josiane", name:"foto-3x4.jpg", mime:"image/jpeg", size:210000, source:"form", status:"mirrored", at:"2026-08-20", has_content:false },
          { id:"3", contact:"josiane", name:"comprovante-pagamento.pdf", mime:"application/pdf", size:120000, source:"conversation", status:"mirrored", at:"2026-08-19", has_content:false },
          { id:"4", contact:"ana", name:"contrato-social.pdf", mime:"application/pdf", size:1500000, source:"media", status:"mirrored", at:"2026-08-18", has_content:false },
          { id:"5", contact:"ana", name:"comprovante-endereco.jpg", mime:"image/jpeg", size:330000, source:"media", status:"mirrored", at:"2026-08-18", has_content:false },
        ];
        active = "josiane";
      }

      boot();
    </script>
  </body>
</html>
