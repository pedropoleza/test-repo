<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155EEF" />
    <title>Cofre de Documentos · Spark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <style>
      .badge--warn { background: var(--warn-bg); color: var(--warn); }
      .topbar { position:sticky; top:0; z-index:30; height:56px; display:flex; align-items:center; gap:16px; padding:0 var(--content-pad); background:var(--white); border-bottom:1px solid var(--gray-200); }
      .loc { display:inline-flex; align-items:center; gap:9px; font-weight:700; color:var(--gray-900); }
      .loc svg { width:18px; height:18px; color:var(--ghl-600); }
      .wrap { padding:var(--content-pad); position:relative; z-index:1; }

      .folders { display:flex; align-items:flex-end; gap:4px; flex-wrap:wrap; padding:0 6px; position:relative; z-index:2; }
      .folder-tab { display:inline-flex; align-items:center; gap:9px; padding:11px 16px 13px; background:var(--gray-100); border:1px solid var(--gray-200); border-bottom:none; border-radius:12px 12px 0 0; color:var(--gray-600); font-weight:600; font-size:var(--fs-base); transition:background var(--d-fast),color var(--d-fast); position:relative; top:1px; max-width:260px; }
      .folder-tab:hover { background:var(--gray-50); color:var(--gray-900); }
      .folder-tab .fico { width:18px; height:18px; flex-shrink:0; color:var(--ghl-500); }
      .folder-tab .fname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .folder-tab .fcount { font-variant-numeric:tabular-nums; background:var(--gray-200); color:var(--gray-600); padding:1px 8px; border-radius:var(--r-pill); font-size:11px; font-weight:700; }
      .folder-tab.is-active { background:var(--white); color:var(--ghl-700); box-shadow:0 -6px 16px -10px rgba(15,23,42,.22); z-index:3; }
      .folder-tab.is-active .fico { color:var(--ghl-600); }
      .folder-tab.is-active .fcount { background:var(--ghl-100); color:var(--ghl-700); }
      .folder-tab--new { background:transparent; border-style:dashed; color:var(--ghl-600); }
      .folder-tab--new:hover { background:var(--ghl-50); }

      .folder-body { background:var(--white); border:1px solid var(--gray-200); border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg); box-shadow:var(--shadow-sm); padding:24px; position:relative; z-index:1; min-height:220px; }
      .folder-head { display:flex; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--gray-150); }
      .avatar-lg { width:52px; height:52px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,var(--ghl-500),var(--ghl-700)); color:#fff; font-weight:800; font-size:17px; display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow-blue); }
      .folder-head__name { margin:0; font-size:var(--fs-xl); font-weight:800; letter-spacing:-.02em; color:var(--gray-900); }
      .folder-head__sub { margin:3px 0 0; color:var(--gray-500); font-size:var(--fs-sm); }
      .info-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
      .info-chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--r-pill); font-size:var(--fs-sm); color:var(--gray-700); }
      .info-chip svg { width:13px; height:13px; color:var(--gray-400); }
      .info-chip strong { color:var(--gray-900); font-weight:600; }

      .uploader { margin-top:18px; border:1.5px dashed var(--gray-300); border-radius:var(--r-lg); padding:18px; display:flex; align-items:center; gap:14px; background:var(--gray-50); transition:all var(--d-fast); }
      .uploader.is-drag { border-color:var(--ghl-400); background:var(--ghl-50); box-shadow:var(--shadow-blue-soft); }
      .uploader__txt { color:var(--gray-500); font-size:var(--fs-sm); }
      .btn-primary { height:36px; padding:0 16px; border-radius:var(--r-md); border:0; background:var(--ghl-600); color:#fff; font-weight:700; font-size:var(--fs-sm); box-shadow:var(--shadow-blue); transition:all var(--d-fast); }
      .btn-primary:hover { background:var(--ghl-700); }
      .btn-primary:disabled { background:var(--gray-300); box-shadow:none; cursor:not-allowed; }

      .files { margin-top:18px; display:flex; flex-direction:column; }
      .file { display:grid; grid-template-columns:40px 1fr auto auto auto; align-items:center; gap:14px; padding:12px 6px; border-bottom:1px solid var(--gray-150); }
      .file:last-child { border-bottom:none; }
      .file__ico { width:40px; height:40px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; }
      .file__ico svg { width:20px; height:20px; }
      .file__ico[data-kind="image"] { background:#eef4ff; color:var(--ghl-600); }
      .file__ico[data-kind="pdf"]   { background:var(--danger-bg); color:var(--danger); }
      .file__ico[data-kind="doc"]   { background:var(--gray-100); color:var(--gray-600); }
      .file__name { font-weight:600; color:var(--gray-900); word-break:break-word; }
      .file__meta { font-size:var(--fs-xs); color:var(--gray-500); margin-top:2px; }
      .src { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--gray-700); font-weight:500; }
      .src .dot { width:8px; height:8px; border-radius:50%; }
      .src[data-source="media"] .dot { background:var(--ghl-500); }
      .src[data-source="conversation"] .dot { background:var(--success); }
      .src[data-source="form"] .dot { background:var(--warn); }
      .src[data-source="upload"] .dot { background:#6366f1; }
      .btn-ghost { height:32px; padding:0 14px; border-radius:var(--r-md); border:1px solid var(--gray-200); background:var(--white); color:var(--ghl-700); font-weight:600; font-size:var(--fs-sm); transition:all var(--d-fast); text-decoration:none; display:inline-flex; align-items:center; }
      .btn-ghost:hover { border-color:var(--ghl-300); box-shadow:var(--shadow-blue-soft); }
      .btn-ghost.is-disabled { color:var(--gray-300); border-color:var(--gray-150); pointer-events:none; }
      .empty-files { padding:34px 0; text-align:center; color:var(--gray-400); }
      .empty-state-lg { padding:60px 20px; text-align:center; }
      .empty-state-lg h3 { margin:0 0 6px; color:var(--gray-800); font-size:var(--fs-lg); }
      .empty-state-lg p { margin:0 0 18px; color:var(--gray-500); }

      /* Filtro de setores (pipelines) */
      .pipes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
      .pipes__label { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--gray-400); font-weight:700; margin-right:2px; }
      .pipe { display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:var(--r-pill); background:var(--white); border:1px solid var(--gray-200); color:var(--gray-700); font-size:var(--fs-sm); font-weight:600; cursor:pointer; transition:all var(--d-fast); }
      .pipe:hover { border-color:var(--ghl-300); color:var(--ghl-700); }
      .pipe.is-active { background:var(--ghl-50); border-color:var(--ghl-300); color:var(--ghl-700); box-shadow:var(--shadow-blue-soft); }
      .pipe .count { font-variant-numeric:tabular-nums; background:var(--gray-100); color:var(--gray-600); padding:0 7px; border-radius:var(--r-pill); font-size:11px; }
      .pipe.is-active .count { background:var(--ghl-100); color:var(--ghl-700); }
      .pipe-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--r-pill); background:var(--ghl-50); color:var(--ghl-700); border:1px solid var(--ghl-100); font-size:var(--fs-sm); font-weight:600; }
      .pipe-badge .stage { color:var(--gray-500); font-weight:500; }

      /* Modal */
      .modal-back { position:fixed; inset:0; background:rgba(15,23,42,.42); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:60px 16px; }
      .modal-card { width:100%; max-width:520px; background:var(--white); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); overflow:hidden; }
      .modal-h { padding:20px 22px; border-bottom:1px solid var(--gray-150); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
      .modal-h h3 { margin:0; font-size:var(--fs-lg); font-weight:800; color:var(--gray-900); }
      .modal-h p { margin:3px 0 0; color:var(--gray-500); font-size:var(--fs-sm); }
      .modal-x { border:0; background:var(--gray-100); width:32px; height:32px; border-radius:8px; color:var(--gray-600); font-size:16px; cursor:pointer; }
      .modal-b { padding:20px 22px; }
      .modal-f { padding:16px 22px; border-top:1px solid var(--gray-150); display:flex; justify-content:flex-end; gap:10px; }
      .input { width:100%; height:40px; padding:0 12px; border:1px solid var(--gray-200); border-radius:var(--r-md); background:var(--white); font:inherit; color:var(--gray-900); }
      .input:focus { outline:none; border-color:var(--ghl-400); box-shadow:var(--shadow-blue-soft); }
      .results { margin-top:10px; max-height:230px; overflow-y:auto; border:1px solid var(--gray-150); border-radius:var(--r-md); }
      .result { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--gray-100); }
      .result:last-child { border-bottom:none; }
      .result:hover { background:var(--gray-50); }
      .result.is-sel { background:var(--ghl-50); }
      .result__av { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--ghl-500),var(--ghl-700)); color:#fff; font-weight:700; font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
      .result__name { font-weight:600; color:var(--gray-900); }
      .result__meta { font-size:var(--fs-xs); color:var(--gray-500); }
      .staged { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
      .staged__item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; background:var(--gray-50); border:1px solid var(--gray-150); border-radius:var(--r-md); font-size:var(--fs-sm); }
      .staged__item button { border:0; background:transparent; color:var(--danger); cursor:pointer; font-weight:700; }
      .btn-line { height:36px; padding:0 14px; border-radius:var(--r-md); border:1px solid var(--gray-200); background:var(--white); color:var(--gray-700); font-weight:600; font-size:var(--fs-sm); cursor:pointer; }
      .muted { color:var(--gray-500); font-size:var(--fs-sm); }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span class="orb orb--a"></span><span class="orb orb--b"></span><span class="orb orb--c"></span></div>

    <header class="topbar">
      <span class="loc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.686-7-11a7 7 0 0114 0c0 5.314-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="loc-name">Cofre de Documentos</span>
      </span>
    </header>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <main class="wrap">
      <div class="pipes" id="pipes" hidden></div>
      <div class="folders" id="folders"></div>
      <div class="folder-body" id="folder-body"></div>
    </main>

    <input type="file" id="file-input" multiple hidden accept="image/*,application/pdf,.doc,.docx,.txt,.xls,.xlsx" />
    <div id="modal-root"></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
      const initials = (name) => (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      const humanSize = (b) => (b==null) ? "" : b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB";
      const SRC = { media:"Nuvem", conversation:"WhatsApp", form:"Formulário", upload:"Enviado" };

      const ICONS = {
        folder: '<svg class="fico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>',
        phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>',
        mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>',
        image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
        pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
        doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>',
      };
      const kindOf = (mime, name) => { const m=(mime||"").toLowerCase(), n=(name||"").toLowerCase();
        if (m.startsWith("image/")||/\.(png|jpe?g|gif|webp|heic|bmp)$/.test(n)) return "image";
        if (m==="application/pdf"||n.endsWith(".pdf")) return "pdf"; return "doc"; };

      let MODE="demo", SESSION=null, LOCATION=null;
      let FOLDERS=[], FILES=[], active=null;
      let PIPELINES=[], CPMAP={}, activePipe="all";
      const filesOf = (cid) => FILES.filter((f) => f.contact === cid);
      const inPipe = (c) => activePipe==="all" || (CPMAP[c.id]?.pipelineId === activePipe);

      function renderPipes() {
        const box = $("#pipes");
        if (!PIPELINES.length) { box.hidden = true; return; }
        box.hidden = false;
        const countIn = (pid) => FOLDERS.filter((c) => CPMAP[c.id]?.pipelineId === pid).length;
        const chips = [`<span class="pipes__label">Setor</span>`,
          `<button class="pipe ${activePipe==="all"?"is-active":""}" data-pipe="all">Todos <span class="count">${FOLDERS.length}</span></button>`]
          .concat(PIPELINES.map((p) => `<button class="pipe ${activePipe===p.id?"is-active":""}" data-pipe="${p.id}">${p.name} <span class="count">${countIn(p.id)}</span></button>`));
        box.innerHTML = chips.join("");
        box.querySelectorAll(".pipe").forEach((b) => b.addEventListener("click", () => { activePipe = b.dataset.pipe; const vis = FOLDERS.filter(inPipe); if (!vis.find((c)=>c.id===active)) active = vis[0]?.id || null; renderPipes(); renderFolders(); renderBody(); }));
      }

      function renderFolders() {
        renderPipes();
        const visible = FOLDERS.filter(inPipe);
        const html = visible.map((c) => `<button class="folder-tab ${c.id===active?"is-active":""}" data-folder="${c.id}">${ICONS.folder}<span class="fname">${c.name}</span><span class="fcount">${filesOf(c.id).length}</span></button>`).join("");
        $("#folders").innerHTML = html + `<button class="folder-tab folder-tab--new" id="new-folder">+ Nova pasta de contato</button>`;
        $("#folders").querySelectorAll(".folder-tab[data-folder]").forEach((b) => b.addEventListener("click", () => { active=b.dataset.folder; renderFolders(); renderBody(); }));
        $("#new-folder").addEventListener("click", openModal);
      }

      function renderBody() {
        const c = FOLDERS.find((x) => x.id === active);
        if (!c) {
          $("#folder-body").innerHTML = `<div class="empty-state-lg"><h3>Nenhuma pasta ainda</h3><p>Crie uma pasta de contato para começar a guardar documentos.</p><button class="btn-primary" id="empty-new">+ Nova pasta de contato</button></div>`;
          $("#empty-new")?.addEventListener("click", openModal); return;
        }
        const chips = [];
        if (c.phone) chips.push(`<span class="info-chip">${ICONS.phone}<span>Telefone:</span> <strong>${c.phone}</strong></span>`);
        if (c.email) chips.push(`<span class="info-chip">${ICONS.mail}<span>Email:</span> <strong>${c.email}</strong></span>`);
        const list = filesOf(c.id);
        const pinfo = CPMAP[c.id];
        const pbadge = pinfo ? `<span class="pipe-badge">${pinfo.pipelineName||"Funil"}${pinfo.stageName?` <span class="stage">· ${pinfo.stageName}</span>`:""}</span>` : "";
        const allChips = (pbadge?[pbadge]:[]).concat(chips);
        const head = `<div class="folder-head"><span class="avatar-lg">${initials(c.name)}</span><div><h2 class="folder-head__name">${c.name}</h2><p class="folder-head__sub">${list.length} arquivo${list.length===1?"":"s"}</p>${allChips.length?`<div class="info-chips">${allChips.join("")}</div>`:""}</div></div>`;
        const uploader = `<div class="uploader" id="uploader"><button class="btn-primary" id="add-files">+ Adicionar arquivos</button><span class="uploader__txt">ou arraste os arquivos aqui (até 4MB)</span></div>`;
        const files = list.length ? `<div class="files">${list.map(fileRow).join("")}</div>` : `<div class="empty-files">Nenhum arquivo nesta pasta ainda</div>`;
        $("#folder-body").innerHTML = head + uploader + files;
        wireUploader(c);
      }

      function fileRow(f) {
        const kind = kindOf(f.mime, f.name);
        const meta = [humanSize(f.size), (f.at||"").slice(0,10)].filter(Boolean).join(" · ");
        let action;
        if (f.blobUrl) action = `<a class="btn-ghost" href="${f.blobUrl}" target="_blank" rel="noopener">Abrir</a>`;
        else if (f.has_content && MODE==="live") action = `<a class="btn-ghost" href="/api/file?id=${encodeURIComponent(f.id)}&session=${encodeURIComponent(SESSION)}" target="_blank" rel="noopener">Abrir</a>`;
        else action = `<span class="btn-ghost is-disabled">Processando</span>`;
        return `<div class="file"><div><span class="file__ico" data-kind="${kind}">${ICONS[kind]}</span></div><div><div class="file__name">${f.name||"—"}</div><div class="file__meta">${meta}</div></div><span class="src" data-source="${f.source}"><span class="dot"></span>${SRC[f.source]||f.source}</span><span></span>${action}</div>`;
      }

      // ---- Upload (na pasta aberta) ----
      function wireUploader(c) {
        const z = $("#uploader"); if (!z) return;
        $("#add-files").addEventListener("click", () => { pendingContact=c; $("#file-input").click(); });
        ["dragover","dragenter"].forEach(ev => z.addEventListener(ev,(e)=>{e.preventDefault();z.classList.add("is-drag");}));
        ["dragleave","drop"].forEach(ev => z.addEventListener(ev,(e)=>{e.preventDefault();z.classList.remove("is-drag");}));
        z.addEventListener("drop",(e)=>{ pendingContact=c; handleFiles(e.dataTransfer.files); });
      }
      let pendingContact=null;
      $("#file-input").addEventListener("change",(e)=>{ handleFiles(e.target.files); e.target.value=""; });

      async function handleFiles(fileList) {
        const c = pendingContact; if (!c) return;
        for (const file of fileList) await uploadOne(c, file);
      }
      async function uploadOne(c, file) {
        if (file.size > 4*1024*1024) { toast("warn","Arquivo acima de 4MB",file.name); return false; }
        if (MODE==="demo") { const blobUrl=URL.createObjectURL(file); FILES.unshift({id:"demo-"+Math.random().toString(36).slice(2),contact:c.id,name:file.name,mime:file.type,size:file.size,source:"upload",at:new Date().toISOString(),blobUrl}); toast("success","Arquivo adicionado",file.name); renderFolders(); renderBody(); return true; }
        try {
          toast("info","Enviando…",file.name);
          const dataBase64 = await fileToBase64(file);
          const r = await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json","x-vault-session":SESSION},body:JSON.stringify({contactId:c.id,contactName:c.name,filename:file.name,mime:file.type,dataBase64})});
          if (!r.ok) throw new Error("http_"+r.status);
          const j = await r.json();
          FILES.unshift({id:j.document.id,contact:c.id,name:file.name,mime:file.type,size:file.size,source:"upload",at:new Date().toISOString(),has_content:true});
          toast("success","Arquivo adicionado",file.name); renderFolders(); renderBody(); return true;
        } catch (err) { toast("warn","Falha ao enviar",file.name+" · "+err.message); return false; }
      }
      const fileToBase64 = (file) => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });

      // ---- Modal "Nova pasta de contato" ----
      let mSelected=null, mStaged=[], mTimer=null;
      function openModal() {
        mSelected=null; mStaged=[];
        $("#modal-root").innerHTML = `
          <div class="modal-back" id="mback">
            <div class="modal-card">
              <div class="modal-h"><div><h3>Nova pasta de contato</h3><p>Selecione o contato e anexe os arquivos.</p></div><button class="modal-x" id="mx">✕</button></div>
              <div class="modal-b">
                <input class="input" id="msearch" placeholder="${MODE==="live"?"Buscar contato pelo nome, email ou telefone…":"Buscar contato (demo)…"}" autocomplete="off" />
                <div class="results" id="mresults"></div>
                <div id="mfiles"></div>
              </div>
              <div class="modal-f"><button class="btn-line" id="mcancel">Cancelar</button><button class="btn-primary" id="mcreate" disabled>Criar pasta</button></div>
            </div>
          </div>`;
        $("#mx").onclick = $("#mcancel").onclick = closeModal;
        $("#mback").addEventListener("click",(e)=>{ if(e.target.id==="mback") closeModal(); });
        $("#msearch").addEventListener("input",(e)=>{ clearTimeout(mTimer); const q=e.target.value; mTimer=setTimeout(()=>searchContacts(q),250); });
        $("#mcreate").addEventListener("click", confirmModal);
        searchContacts("");
        setTimeout(()=>$("#msearch")?.focus(),40);
      }
      function closeModal(){ $("#modal-root").innerHTML=""; }
      async function searchContacts(q) {
        const box=$("#mresults"); if(!box) return;
        let list=[];
        if (MODE==="live") {
          try { const r=await fetch("/api/contacts?q="+encodeURIComponent(q),{headers:{"x-vault-session":SESSION}}); if(r.ok) list=(await r.json()).contacts||[]; }
          catch {}
        } else {
          list=DEMO_CONTACTS.filter(c=>!q||c.name.toLowerCase().includes(q.toLowerCase()));
        }
        box.innerHTML = list.length ? list.map(c=>`<div class="result ${mSelected&&mSelected.id===c.id?"is-sel":""}" data-id="${c.id}" data-name="${encodeURIComponent(c.name)}" data-email="${encodeURIComponent(c.email||"")}" data-phone="${encodeURIComponent(c.phone||"")}"><span class="result__av">${initials(c.name)}</span><div><div class="result__name">${c.name}</div><div class="result__meta">${[c.email,c.phone].filter(Boolean).join(" · ")||"—"}</div></div></div>`).join("") : `<div style="padding:14px" class="muted">Nenhum contato encontrado.</div>`;
        box.querySelectorAll(".result").forEach(r=>r.addEventListener("click",()=>{
          mSelected={ id:r.dataset.id, name:decodeURIComponent(r.dataset.name), email:decodeURIComponent(r.dataset.email)||null, phone:decodeURIComponent(r.dataset.phone)||null };
          box.querySelectorAll(".result").forEach(x=>x.classList.toggle("is-sel",x===r));
          $("#mcreate").disabled=false; renderStaged();
        }));
      }
      function renderStaged() {
        const box=$("#mfiles"); if(!box) return;
        box.innerHTML = `<div class="uploader" id="muploader" style="margin-top:14px"><button class="btn-line" id="maddfiles" type="button">Anexar arquivos</button><span class="uploader__txt">opcional — você também pode adicionar depois</span></div>
          <div class="staged">${mStaged.map((f,i)=>`<div class="staged__item"><span>${f.name} <span class="muted">· ${humanSize(f.size)}</span></span><button data-i="${i}">remover</button></div>`).join("")}</div>`;
        $("#maddfiles").onclick=()=>{ modalPick(); };
        box.querySelectorAll(".staged__item button").forEach(b=>b.addEventListener("click",()=>{ mStaged.splice(+b.dataset.i,1); renderStaged(); }));
      }
      function modalPick() {
        const inp=el("input"); inp.type="file"; inp.multiple=true; inp.accept="image/*,application/pdf,.doc,.docx,.txt,.xls,.xlsx";
        inp.onchange=()=>{ for(const f of inp.files){ if(f.size>4*1024*1024){toast("warn","Arquivo acima de 4MB",f.name);continue;} mStaged.push(f);} renderStaged(); };
        inp.click();
      }
      async function confirmModal() {
        if (!mSelected) return;
        $("#mcreate").disabled=true; $("#mcreate").textContent="Criando…";
        // cria/ativa a pasta do contato
        if (!FOLDERS.find(f=>f.id===mSelected.id)) FOLDERS.push({ id:mSelected.id, name:mSelected.name, email:mSelected.email, phone:mSelected.phone });
        active=mSelected.id;
        // sobe os arquivos anexados
        for (const f of mStaged) await uploadOne(mSelected, f);
        closeModal(); renderFolders(); renderBody();
      }

      function toast(kind,title,sub){ const n=el("div",`toast toast--${kind==="warn"?"warn":kind==="info"?"info":"success"}`); n.innerHTML=`<div class="toast__icon">${kind==="warn"?"!":"✓"}</div><div><div class="toast__title">${title}</div><div class="toast__sub">${sub||""}</div></div>`; $("#toasts").appendChild(n); setTimeout(()=>{n.classList.add("is-out");setTimeout(()=>n.remove(),260);},3200); }

      function ingest(docs) {
        const byC={}, files=[];
        for (const d of docs) { const cid=d.contact_id||"__sem_contato__"; (byC[cid] ||= {id:cid, name:d.contact_name||d.contact_id||"Sem contato"}); files.push({id:d.id,contact:cid,name:d.filename||"(sem nome)",mime:d.mime,size:d.size_bytes,source:d.source,at:d.at,has_content:d.has_content}); }
        FOLDERS=Object.values(byC); FILES=files; if(!active&&FOLDERS[0]) active=FOLDERS[0].id;
      }

      function requestGhlContext() {
        return new Promise((resolve,reject)=>{ let done=false;
          const onMsg=(e)=>{ const d=e.data; if(d&&d.message==="REQUEST_USER_DATA_RESPONSE"){ done=true; window.removeEventListener("message",onMsg); resolve(d.payload); } };
          window.addEventListener("message",onMsg);
          try { window.parent.postMessage({message:"REQUEST_USER_DATA"},"*"); } catch {}
          setTimeout(()=>{ if(!done){ window.removeEventListener("message",onMsg); reject(new Error("no_ghl_context")); } },4000);
        });
      }
      async function boot() {
        if (window.self !== window.top) {
          try {
            const encrypted = await requestGhlContext();
            const sres = await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({encrypted})});
            if (!sres.ok) throw new Error("session_"+sres.status);
            const s = await sres.json(); SESSION=s.sessionToken; LOCATION=s.locationId; MODE="live";
            $("#loc-name").textContent = s.locationName || s.locationId;
            const dres = await fetch("/api/documents",{headers:{"x-vault-session":SESSION}});
            if (dres.ok) ingest((await dres.json()).documents||[]);
            try { const pr=await fetch("/api/pipelines",{headers:{"x-vault-session":SESSION}}); if(pr.ok){ const pj=await pr.json(); PIPELINES=pj.pipelines||[]; CPMAP=pj.contacts||{}; } } catch {}
            renderFolders(); renderBody(); return;
          } catch (err) { console.warn("[vault] live falhou, demo:", err.message); }
        }
        MODE="demo"; $("#loc-name").textContent="Samantha's Account (demo)"; loadDemo(); renderFolders(); renderBody();
      }

      const DEMO_CONTACTS = [
        { id:"josiane", name:"Josiane Ramos", email:"josiane.ramos@email.com", phone:"+1 (973) 555-0142" },
        { id:"ana", name:"Ana Beatriz", email:"ana.beatriz@email.com", phone:"+1 (862) 555-0199" },
        { id:"carlos", name:"Carlos Nunes", email:"carlos.nunes@email.com", phone:"+1 (201) 555-0177" },
        { id:"teste", name:"teste spark", email:null, phone:null },
      ];
      function loadDemo() {
        FOLDERS = [
          { id:"josiane", name:"Josiane Ramos", email:"josiane.ramos@email.com", phone:"+1 (973) 555-0142" },
          { id:"ana", name:"Ana Beatriz", email:"ana.beatriz@email.com", phone:"+1 (862) 555-0199" },
          { id:"carlos", name:"Carlos Nunes", email:"carlos.nunes@email.com", phone:"+1 (201) 555-0177" },
        ];
        FILES = [
          { id:"1", contact:"josiane", name:"passaporte-antigo.pdf", mime:"application/pdf", size:842000, source:"media", at:"2026-08-20", has_content:false },
          { id:"2", contact:"josiane", name:"foto-3x4.jpg", mime:"image/jpeg", size:210000, source:"form", at:"2026-08-20", has_content:false },
          { id:"3", contact:"ana", name:"contrato-social.pdf", mime:"application/pdf", size:1500000, source:"upload", at:"2026-08-18", has_content:false },
        ];
        PIPELINES = [
          { id:"p1", name:"1 · Seguro de Vida" },
          { id:"p3", name:"3 · Empresas e Fiscal" },
        ];
        CPMAP = {
          josiane:{ pipelineId:"p1", pipelineName:"1 · Seguro de Vida", stageName:"Follow-up" },
          carlos:{ pipelineId:"p1", pipelineName:"1 · Seguro de Vida", stageName:"Qualified" },
          ana:{ pipelineId:"p3", pipelineName:"3 · Empresas e Fiscal", stageName:"In Process" },
        };
        active="josiane";
      }
      boot();
    </script>
  </body>
</html>
