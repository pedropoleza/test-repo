<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155EEF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <title>Spark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <!-- Cópia própria dos tokens do produto: projeto separado, sem pasta pai. -->
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/workspace.css" />
  </head>
  <body class="ws-body">
    <a class="ws-skip-link" href="#ws-main">Ir para o conteúdo</a>

    <div class="ws-shell" id="ws-shell">
      <div class="ws-sidebar-backdrop" id="ws-sidebar-backdrop" hidden></div>

      <button
        type="button"
        class="ws-sidebar-handle"
        id="ws-sidebar-handle"
        aria-controls="ws-sidebar"
        aria-expanded="true"
        aria-label="Minimizar a navegação"
        title="Minimizar a navegação"
      >
        <span class="ws-sidebar-handle__chevron" aria-hidden="true"></span>
      </button>

      <aside class="ws-sidebar" id="ws-sidebar" aria-label="Navegação do workspace">
        <div class="ws-sidebar__head">
          <img
            class="ws-sidebar__logo"
            src="./assets/logo.png"
            alt="Spark"
            width="28"
            height="28"
          />
          <span class="ws-sidebar__name">Spark</span>
        </div>

        <button type="button" class="ws-sidebar__new" id="ws-new-page">
          <span aria-hidden="true">+</span> Nova página
        </button>

        <nav class="ws-tree" id="ws-sidebar-tree" role="tree" aria-label="Páginas"></nav>
      </aside>

      <div class="ws-content">
        <header class="ws-topbar">
          <button type="button" class="ws-back" id="ws-back" title="Voltar (Alt + ←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5" />
              <path d="M12 19l-7-7 7-7" />
            </svg>
            <span>Voltar</span>
          </button>

          <button
            type="button"
            class="ws-icon-btn ws-topbar__toggle"
            id="ws-sidebar-toggle"
            aria-label="Abrir ou fechar a navegação"
          >
            ☰
          </button>

          <div class="ws-topbar__right">
            <span class="ws-save" id="ws-save-state" data-state="saved" role="status" aria-live="polite"></span>
            <button type="button" class="ws-icon-btn" id="ws-favorite" hidden aria-pressed="false">☆</button>
            <button type="button" class="ws-icon-btn" id="ws-page-menu" hidden aria-label="Ações da página">⋯</button>
          </div>
        </header>

        <main class="ws-main" id="ws-main" tabindex="-1">
          <div class="ws-page">
            <div id="ws-page-header"></div>
            <div class="ws-editor" id="ws-editor"></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
